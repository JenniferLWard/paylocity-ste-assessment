name: Cypress Tests
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 6 * * *" # Runs at 06:00 UTC, 1:00 AM EST
  # NOTE: In a production setup, smoke and regression would typically be
  # triggered by deployment events and tied to specific environments
  # (e.g. smoke runs automatically on deploy to staging/prod, regression
  # runs on a nightly schedule against a stable environment), managed
  # typically through DevOps-owned pipeline configuration rather than a single
  # generic workflow_dispatch input. This simplified setup approximates
  # that intent for demonstration purposes.
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to run (@smoke or @regression)"
        required: false

jobs:
  cypress:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        tag: [smoke, regression]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
      - run: npm ci
      - uses: cypress-io/github-action@v6
        with:
          browser: chrome
          env: CYPRESS_grepTags=@${{ matrix.tag }}
        env:
          CYPRESS_BASE_URL: ${{ secrets.BASE_URL }}
          CYPRESS_UI_LOGIN_URL: ${{ secrets.UI_LOGIN_URL }}
          CYPRESS_TEST_USERNAME: ${{ secrets.TEST_USERNAME }}
          CYPRESS_TEST_PASSWORD: ${{ secrets.TEST_PASSWORD }}
          CYPRESS_TEST_AUTH_TOKEN: ${{ secrets.TEST_AUTH_TOKEN }}
      - name: Upload screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.tag }}-videos-${{ github.run_id }}
          path: cypress/videos
