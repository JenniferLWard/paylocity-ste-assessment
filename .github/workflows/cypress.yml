name: Cypress Tests
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to run (@smoke or @regression)"
        required: false
        default: "@smoke"

jobs:
  cypress:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        tag: [smoke, regression]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
      - run: npm ci
      - uses: cypress-io/github-action@v6
        with:
          browser: chrome
          env: CYPRESS_grepTags=@${{ matrix.tag }}
      - name: Upload screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.tag }}-screenshots-${{ github.run_id }}
          path: cypress/screenshots
      - name: Upload videos
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.tag }}-videos-${{ github.run_id }}
          path: cypress/videos
